name: Deploy Site

# Compiles the TypeScript with `tsc`, assembles dist/, and publishes it to
# GitHub Pages. The custom domain (wago.sh) is served from the CNAME file.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Reusable: sync workflows call this after committing fresh artifacts.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Reusable sync callers push during their run. Resolve main again so
          # this build includes that new commit rather than the caller's SHA.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pin generated Wago source
        run: |
          wago_source_ref=$(node -p "require('./data/facts.json').source.commit")
          echo "WAGO_FACTS_REF=$wago_source_ref" >> "$GITHUB_ENV"

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

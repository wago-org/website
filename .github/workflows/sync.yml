name: Sync stats from wago

# Keeps the site's numbers honest. Pulls the live conformance/coverage/feature
# data out of Wago's published SPECTEST.md, FEATURES.md, and checked-in
# baselines via scripts/sync-stats.mjs, and if
# data/stats.json changed, commits it and redeploys the site.
#
# Triggers:
#   - schedule:            a daily heartbeat
#   - workflow_dispatch:   run it by hand
#   - repository_dispatch: let wago's CI poke us after it updates its stats
#       (event type "wago-updated"; send a POST to this repo's dispatches API
#        with a token that has `contents: write`).

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [wago-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout wago (public, read-only)
        uses: actions/checkout@v4
        with:
          repository: wago-org/wago
          ref: main
          path: wago-src
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate site data from wago
        env:
          WAGO_DIR: ${{ github.workspace }}/wago-src
        run: |
          npm run sync
          npm run sync:facts
          npm run sync:ai

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data facts.md compatibility.md security.md benchmarks.md v1/schema.json v1/providers.schema.json index.html llms.txt llms-full.txt sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated site data is unchanged - nothing to deploy."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data facts.md compatibility.md security.md benchmarks.md v1/schema.json v1/providers.schema.json index.html llms.txt llms-full.txt sitemap.xml
          git commit -m "chore: sync site data from wago"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
